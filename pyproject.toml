[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediencoder"
version = "0.2.0"
description = "Cross-fitted representation learning for causal mediation research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3",
  "pandas>=2.1", "torch>=2.2", "filelock>=3.13", "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest>=8"]
rds = ["pyreadr>=0.5"]

[project.scripts]
mediencoder-simulate = "mediencoder.simulation.runner:main"
mediencoder-monitor = "mediencoder.simulation.monitor:main"
mediencoder-real-data = "mediencoder.real_data.cli:main"
mediencoder-compare = "mediencoder.comparison.runner:main"

[project.urls]
Repository = "https://github.com/shibo769/MediEncoder"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
